server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A single-page app has one real HTML file. Any other path is a
  # client-side route, so hand back index.html rather than a 404 and
  # let React figure it out.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints its build output (app.a1b2c3.js), so those files
  # can be cached hard — a new build produces a new filename.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NOT be cached: it's the file that points at the
  # fingerprinted assets, so a stale copy pins the browser to an old
  # build forever.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}